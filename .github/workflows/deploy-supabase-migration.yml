name: Deploy Supabase migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Apply forum permissions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: supabase-production
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Apply forum migration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Configure SUPABASE_DB_URL in the supabase-production environment."
            exit 1
          fi
          psql "$SUPABASE_DB_URL" \
            --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20261023090000_forum_comments.sql
